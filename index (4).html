<style>
/* Talimger Compass — дизайн жүйесі (premium SaaS, WCAG 2.2 AA) */
:root{
  --pri:#0F5C74; --pri-2:#0B4A5E; --pri-soft:#E4EFF2; --gold:#C8962E; --gold-ink:#8A6416; --gold-soft:#FBF3E2;
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#1E293B; --ink-2:#475569; --muted:#64748B; --line:#E5E2DA; --line-2:#D6D2C8;
  --ok:#17794A; --ok-soft:#E5F4EC; --warn:#B4472A; --warn-soft:#FBEAE4;
  --r:14px; --r-sm:10px; --sh:0 1px 2px rgba(30,41,59,.05),0 1px 3px rgba(30,41,59,.06); --sh-2:0 10px 30px rgba(30,41,59,.14);
  --font:Inter,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif; --side:252px;
}
[data-theme=dark]{
  --pri:#5FB4CC; --pri-2:#7CC6DA; --pri-soft:#16323B; --gold:#E0B04F; --gold-ink:#E9C276; --gold-soft:#33291A;
  --bg:#0E1518; --card:#151F23; --ink:#E6EDF0; --ink-2:#C2CDD2; --muted:#98A8AF; --line:#24343A; --line-2:#2E4148;
  --ok:#5CCB92; --ok-soft:#14301F; --warn:#F19272; --warn-soft:#3A2119; --sh:0 1px 2px rgba(0,0,0,.3); --sh-2:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:var(--pri);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:700} h2{font-size:1.05rem;font-weight:650} h3{font-size:.98rem;font-weight:650}
p{margin:0 0 .75em} ul,ol{margin:.3em 0 .8em;padding-left:1.25em} hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.small{font-size:.86rem} .muted{color:var(--muted)} .center{text-align:center;justify-content:center} .num{text-align:right;font-variant-numeric:tabular-nums} .strike{text-decoration:line-through;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--warn)}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--pri);color:#fff;padding:8px 12px;border-radius:8px;z-index:200}.skip:focus{left:8px}

/* Layout */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:16px 12px 20px;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;text-decoration:none;color:var(--ink)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:1rem;flex:none;box-shadow:inset 0 -2px 0 var(--gold)}
.brand b{display:block;font-size:.98rem;letter-spacing:-.01em} .brand small{display:block;font-size:.72rem;color:var(--muted);line-height:1.3}
.nav-g{font-size:.7rem;font-weight:650;color:var(--muted);padding:14px 10px 4px;letter-spacing:.02em}
#nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:.9rem;min-height:36px}
#nav a:hover{background:var(--pri-soft);color:var(--ink)}
#nav a.on{background:var(--pri);color:#fff} #nav a.on .ic{color:#fff}
#nav .ic{width:18px;text-align:center;color:var(--muted);font-size:.95rem}
#nav .nb{margin-left:auto;background:var(--gold);color:#1E293B;font-size:.7rem;font-weight:700;border-radius:10px;padding:0 7px}
.main{min-width:0;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:10px;padding:0 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .crumb{font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1px solid var(--line);background:var(--card);height:38px;min-width:38px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;padding:0 8px}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;background:var(--warn);color:#fff;font-size:.65rem;border-radius:10px;padding:1px 5px;font-weight:700}
#userBtn{padding:0 10px 0 4px} #userBtn small{display:block;font-size:.7rem;color:var(--muted);line-height:1.1} #userBtn b{display:block;font-size:.82rem;line-height:1.2;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.av{width:30px;height:30px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:inline-grid;place-items:center;font-size:.75rem;font-weight:700;flex:none}
.av.lg{width:46px;height:46px;font-size:.95rem} .av.sm{width:24px;height:24px;font-size:.65rem}
.menu-btn{display:none}
#view{padding:24px 28px 64px;max-width:1240px;width:100%;margin:0 auto;outline:none}
.ph{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0 0 4px} .ph p{color:var(--ink-2);margin:0;max-width:720px} .ph-x{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Pops */
.pop{position:absolute;right:16px;top:54px;width:340px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);padding:8px;z-index:40}
.pop-h{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px} .pop-h small{display:block;color:var(--muted)}
.pop-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;border:0;background:none;text-decoration:none;color:var(--ink);cursor:pointer;font-size:.9rem;flex-wrap:wrap}
.pop-i:hover{background:var(--pri-soft)} .pop-i small{color:var(--muted);font-size:.75rem;margin-left:auto}
.pop-i.unread{background:var(--gold-soft)} .pop-sep{font-size:.72rem;color:var(--muted);padding:10px 10px 4px} .pop-note{font-size:.78rem;color:var(--muted);padding:8px 10px;margin:0}

/* Components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);margin-bottom:16px}
.card.inset{background:var(--bg);box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap} .card-h h2{margin:0}
.grid{display:grid;gap:16px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.grid.top{align-items:start} .grid>.card{margin-bottom:0} .grid+.card,.grid+.grid,.card+.grid{margin-top:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .row.end{justify-content:flex-end} .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--pri);color:var(--pri)} .btn.p{background:var(--pri);border-color:var(--pri);color:#fff} .btn.p:hover{background:var(--pri-2);color:#fff}
.btn.ghost{background:transparent;border-color:transparent} .btn.ghost:hover{background:var(--pri-soft)} .btn.sm{min-height:32px;padding:4px 10px;font-size:.8rem;border-radius:8px}
.btn.danger{color:var(--warn)} .btn.danger:hover{border-color:var(--warn)} .btn[disabled]{opacity:.5;pointer-events:none}
.x{border:0;background:none;color:var(--muted);font-size:1.15rem;line-height:1;width:30px;height:30px;border-radius:8px;cursor:pointer;flex:none} .x:hover{background:var(--warn-soft);color:var(--warn)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px} .fld label,.fld .lbl{font-size:.8rem;font-weight:600;color:var(--ink-2)} .fld.end{justify-content:flex-end}
.inp{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--card);font-size:.93rem}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 20%,transparent)}
.inp.sm{min-height:32px;padding:4px 8px;font-size:.82rem} textarea.inp{min-height:84px;resize:vertical} textarea.tall{min-height:170px} .w-date{max-width:170px}
input[type=range].inp{padding:0;min-height:30px;border:0;accent-color:var(--pri)}
.fs{border:0;padding:0;margin:0 0 12px} .fs legend{font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.seg{display:inline-flex;background:color-mix(in srgb,var(--line) 70%,transparent);padding:3px;border-radius:11px;gap:2px;flex-wrap:wrap;margin-bottom:14px}
.ph .seg{margin:0} .seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:.83rem;color:var(--ink-2);cursor:pointer;min-height:32px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line-2);background:var(--card);font-size:.82rem;cursor:pointer;min-height:32px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:.74rem;font-weight:600;background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:var(--gold-ink)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.note{border-left:3px solid var(--gold);background:var(--gold-soft);padding:11px 14px;border-radius:0 10px 10px 0;font-size:.88rem;margin-bottom:16px;color:var(--ink)}
.note.info{border-color:var(--pri);background:var(--pri-soft)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r);margin-bottom:16px;font-size:.92rem}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden} .bar>i{display:block;height:100%;background:var(--pri);border-radius:6px} .bar.gold>i{background:var(--gold)} .bar.ok>i{background:var(--ok)} .bar.lg{height:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--sh)}
.kpi>span{font-size:.8rem;color:var(--ink-2);font-weight:600} .kpi b{font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums} .kpi small{color:var(--muted);font-size:.78rem}
.mini .kpi{box-shadow:none;background:var(--bg)} .mini .kpi b{font-size:1.25rem}
.grid.g4+.grid,.grid.g4+section,.grid.g3+.grid{margin-top:16px}
.lst{list-style:none;padding:0;margin:0} .li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)} .li:last-child{border-bottom:0}
.li>div{display:flex;flex-direction:column;min-width:0} .li small{color:var(--muted);font-size:.8rem}
.checks{list-style:none;padding:0;margin:0 0 10px} .checks li{display:flex;align-items:center;gap:6px;border-bottom:1px dashed var(--line)} .checks.two{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer;flex:1;min-height:40px} .check input{width:18px;height:18px;accent-color:var(--pri);flex:none} .check.done span{text-decoration:line-through;color:var(--muted)}
.person{display:flex;gap:12px;align-items:center;margin-bottom:12px} .person b{display:block} .person small{display:block;color:var(--muted);font-size:.8rem}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .qa{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.84rem;font-weight:600} .qa:hover{border-color:var(--pri)} .qa span{color:var(--pri);font-size:1.1rem}
.tw{overflow-x:auto} table.t{width:100%;border-collapse:collapse;font-size:.87rem} .t th,.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} .t th{font-size:.76rem;color:var(--ink-2);font-weight:650;background:color-mix(in srgb,var(--bg) 60%,transparent)} .t code{font-size:.78rem}
.bars{display:flex;flex-direction:column;gap:8px;margin-bottom:8px} .brow{display:grid;grid-template-columns:minmax(110px,40%) 1fr 60px;gap:10px;align-items:center;font-size:.85rem} .brow b{text-align:right;font-variant-numeric:tabular-nums;font-size:.82rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-2)} .legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
svg.radar{width:100%;max-width:460px;display:block;margin:auto} svg.line{width:100%;display:block} svg text{font-family:var(--font)}
.ring{--v:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center;flex:none} .ring b{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.9rem}
.ring.lg{width:84px;height:84px} .ring.lg b{width:66px;height:66px;font-size:1.25rem}
.sticky{position:sticky;top:74px} .h2s{font-size:1rem;margin:0 0 10px} .h3s{font-size:.9rem;margin:14px 0 6px} .big{font-size:1.9rem} .big small{font-size:.8rem;color:var(--muted)} .lead{font-size:1.05rem}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px} .item ul{margin:6px 0 0}

/* Module specifics */
.vgroup{border:0;padding:0;margin:0 0 6px} .vgroup legend{font-weight:650;color:var(--pri);padding:14px 0 4px;font-size:.95rem}
.qrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.scale,.scale5{display:flex;gap:5px} .scale button,.scale5 button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-weight:650}
.scale button.on,.scale5 button.on{background:var(--pri);border-color:var(--pri);color:#fff} .mentor .scale button.on{background:var(--gold);border-color:var(--gold);color:#1E293B}
.scale5{justify-content:space-between} .scale5 button{flex:1;border-radius:10px;width:auto}
.wq{border:0;padding:10px 0;margin:0;border-bottom:1px dashed var(--line)} .wq legend{font-weight:600;font-size:.9rem;padding:0 0 6px} .ends{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:4px}
.skills{list-style:none;padding:0;margin:10px 0} .skills li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem} .skills li span{flex:1}
.st{border:0;border-radius:20px;padding:4px 11px;font-size:.75rem;font-weight:700;cursor:pointer;min-height:28px} .st0{background:var(--line);color:var(--ink-2)} .st1{background:var(--gold-soft);color:var(--gold-ink)} .st2{background:var(--ok-soft);color:var(--ok)}
.stage{position:relative;padding:0 0 18px 26px} .stage::before{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:var(--line)} .stage:last-child::before{display:none}
.stage .dot{position:absolute;left:0;top:4px;width:18px;height:18px;border-radius:50%;border:3px solid var(--pri);background:var(--card)} .stage.done .dot{background:var(--pri)} .stage h3{margin:0}
.mcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start} .mcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)} .why{margin:6px 0 0;font-size:.83rem;color:var(--ink-2)}
.case .ic{font-size:1.6rem;margin-bottom:6px;display:block} .case.pick{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit} .case.pick:hover{border-color:var(--pri)}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line-2);background:var(--card);border-radius:12px;cursor:pointer;margin-bottom:8px;font-size:.92rem} .choice:hover{border-color:var(--pri)} .choice.sel{border-color:var(--pri);background:var(--pri-soft);font-weight:600}
.crit-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px} .crit-btns button{padding:10px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-size:.8rem;font-weight:600;text-align:left;min-height:44px} .crit-btns kbd{float:right;color:var(--muted);font-size:.7rem} .crit-btns button.flash{background:var(--pri);color:#fff}
video{width:100%;border-radius:10px;background:#000;max-height:380px} .clock{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:8px}
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;padding:30px;border:1.5px dashed var(--line-2);border-radius:var(--r);cursor:pointer;font-weight:600} .drop small{font-weight:400;color:var(--muted)}
.mark{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem} .mark .time{border:0;background:var(--pri-soft);color:var(--pri);font-weight:700;border-radius:6px;padding:2px 7px;cursor:pointer;font-variant-numeric:tabular-nums} .scroll-y{max-height:280px;overflow:auto}
.prompt pre{white-space:pre-wrap;font-family:inherit;background:var(--bg);padding:12px;border-radius:10px;font-size:.86rem;margin:8px 0 12px} mark{background:var(--gold-soft);color:var(--gold-ink);border-radius:3px;padding:0 2px}
.lvl{border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)} .lvl.A{background:var(--ok-soft)} .lvl.B{background:var(--pri-soft)} .lvl.C{background:var(--gold-soft)}
.access{font-size:1.15rem;line-height:2;letter-spacing:.03em;word-spacing:.1em;background:#FFFBEA;color:#1E293B;padding:16px;border-radius:12px}
.qa{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:10px;box-shadow:var(--sh)} .qa summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none;display:flex;gap:10px} .qa summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:1.2rem;line-height:1} .qa[open] summary::after{content:"−"} .qa summary::-webkit-details-marker{display:none} .qa-b{padding:0 18px 16px} .refs{font-size:.86rem}

    refs:[['lc',28,1],['lc',1,1,36]], steps:[['Шарттың көшірмесін алыңыз және лауазымдық міндеттерді тексеріңіз.','Получите копию договора и проверьте должностные обязанности.','Get a copy of your contract and check your job duties.'],['Көрсетілмеген маңызды шарт болса, кадр бөлімінен қосымша келісім сұраңыз.','Если важное условие не указано, попросите в отделе кадров дополнительное соглашение.','If a key term is missing, ask HR for an addendum.']], where:['hr'] },
  { id:'a2', sec:'A', q:['Сынақ мерзімі қанша болуы мүмкін?','Какой может быть испытательный срок?','How long can a probation period be?'],
    a:['Сынақ мерзімі еңбек шартында белгіленеді және үш айдан аспауы тиіс (басшыларда — алты айға дейін). Ол еңбек өтіліне есептеледі. Егер жұмыс беруші мерзім аяқталғанда нәтижесіз деп хабарламаса, сынақтан өтті деп саналасыз.','Испытательный срок устанавливается в трудовом договоре и не может превышать трёх месяцев (для руководителей — до шести). Он засчитывается в трудовой стаж. Если по окончании срока работодатель не уведомил о неудовлетворительном результате, испытание считается пройденным.','Probation is set in the contract and cannot exceed three months (up to six for managers). It counts towards length of service. If the employer does not notify you of a negative result when it ends, you are deemed to have passed.'],
    refs:[['lc',36,1],['lc',36,2],['lc',37]], steps:[['Шарттағы сынақ мерзімін тексеріңіз.','Проверьте срок испытания в договоре.','Check the probation term in your contract.'],['Тәлімгерлік жоспардағы нәтижелерді құжаттап отырыңыз.','Документируйте результаты по плану наставничества.','Keep records of your mentoring-plan results.']], where:['hr'] },
  { id:'a3', sec:'A', q:['Жұмыс уақыты мен оқу жүктемесі қандай?','Каковы рабочее время и учебная нагрузка?','What are working hours and teaching load?'],
    a:['Қалыпты жұмыс уақыты аптасына 40 сағаттан аспауы тиіс. Педагогтер үшін еңбекақыны есептеуге арналған апталық оқу жүктемесі заңмен белгіленген: орта білім беру ұйымдарында — 16 сағат. Педагогтердің жұмыс уақыты мен демалыс режимін уәкілетті орган бекіткен қағидалар айқындайды.','Нормальная продолжительность рабочего времени не должна превышать 40 часов в неделю. Для педагогов закон устанавливает недельную учебную нагрузку для расчёта оплаты: в организациях среднего образования — 16 часов. Режим рабочего времени и отдыха педагогов определяется правилами уполномоченного органа.','Normal working time must not exceed 40 hours a week. For teachers, the law sets the weekly teaching load used to calculate pay: 16 hours in secondary schools. Teachers’ working and rest schedules are set by rules of the authorised body.'],
    refs:[['lc',68,1],['ps',8,3],['ps',12,2]], steps:[['Жүктемеңізді тарификация парағымен салыстырыңыз.','Сверьте нагрузку с тарификационным листом.','Compare your load with your pay-rate sheet.'],['Сәйкессіздік болса, кадр бөліміне жазбаша сұрау жіберіңіз.','При расхождении направьте письменный запрос в отдел кадров.','If it differs, send a written query to HR.']], where:['hr','dep'] },
  { id:'a4', sec:'A', q:['Демалыс уақытына қандай құқығым бар?','Какие у меня права на время отдыха?','What are my rights to rest?'],
    a:['Ауысымдар арасындағы демалыс кемінде 12 сағат. Бес күндік жұмыс аптасында екі, алты күндік аптада бір демалыс күні беріледі; жалпы демалыс күні — жексенбі.','Междусменный отдых — не менее 12 часов. При пятидневке предоставляются два выходных дня, при шестидневке — один; общий выходной — воскресенье.','Rest between shifts is at least 12 hours. A five-day week gives two days off, a six-day week one; Sunday is the general day off.'],
    refs:[['lc',83],['lc',84,1],['lc',84,3]], steps:[['Мектептің ішкі тәртіп ережесін және кестеңізді тексеріңіз.','Проверьте правила внутреннего распорядка и своё расписание.','Check the internal rules and your timetable.']], where:['hr','dep'] },
  { id:'a5', sec:'A', q:['Еңбекақы және қосымша төлемдер','Оплата труда и доплаты','Pay and additional payments'],
    a:['Жұмыс беруші жалақыны толық және уақтылы төлеуге міндетті. Педагогке жыл сайынғы еңбек демалысына шыққанда күнтізбелік жылына бір рет кемінде бір лауазымдық айлықақы мөлшерінде сауықтыруға жәрдемақы төленеді. Ауылдық жердегі педагогтердің айлықақысы кемінде 25%-ға жоғары. Тәлімгерге қосымша ақы төленеді.','Работодатель обязан выплачивать зарплату полностью и своевременно. При уходе в ежегодный отпуск педагогу раз в календарный год выплачивается пособие на оздоровление не менее одного должностного оклада. Оклады педагогов в сельской местности выше не менее чем на 25%. Наставнику выплачивается доплата.','The employer must pay wages in full and on time. When taking annual leave, a teacher receives a health allowance of at least one monthly base salary once per calendar year. Rural teachers’ salaries are at least 25% higher. Mentors receive an additional payment.'],
    refs:[['lc',23,2,5],['ps',12,1,4],['ps',12,5],['ps',13,1]], steps:[['Есептеу парағын (расчётный лист) ай сайын тексеріңіз.','Ежемесячно проверяйте расчётный лист.','Check your payslip every month.'],['Сұрақ болса, бухгалтерия мен кадр бөліміне жазбаша жүгініңіз.','При вопросах обратитесь письменно в бухгалтерию и отдел кадров.','Raise questions in writing with accounts and HR.'],['Шешілмесе — келісім комиссиясына.','Если не решено — в согласительную комиссию.','If unresolved — the conciliation commission.']], where:['hr','conc'] },
  { id:'a6', sec:'A', q:['Педагогтің еңбек демалысы қанша күн?','Сколько дней отпуска у педагога?','How long is a teacher’s annual leave?'],
    a:['Педагогке ұзақтығы 56 күнтізбелік күн болатын жыл сайынғы ақылы еңбек демалысы беріледі (жалпы ереже бойынша — 24 күн). Демалысты өндірістік қажеттілікпен үзуге тек қызметкердің жазбаша келісімімен жол беріледі.','Педагогу предоставляется ежегодный оплачиваемый трудовой отпуск продолжительностью 56 календарных дней (по общему правилу — 24 дня). Отозвать из отпуска по производственной необходимости можно только с письменного согласия работника.','Teachers are entitled to 56 calendar days of paid annual leave (the general rule is 24 days). Leave may be interrupted for operational needs only with the employee’s written consent.'],
    refs:[['ps',12,1,3],['lc',88],['lc',95,1]], steps:[['Демалыс кестесін кадр бөлімінен нақтылаңыз.','Уточните график отпусков в отделе кадров.','Confirm the leave schedule with HR.'],['Кері шақырған жағдайда келісім тек жазбаша беріледі.','При отзыве согласие даётся только письменно.','If recalled, consent must be in writing.']], where:['hr','conc'] },
  { id:'a7', sec:'A', q:['Үстеме (сверхурочная) жұмыс','Сверхурочная работа','Overtime work'],
    a:['Үстеме жұмысқа тек қызметкердің жазбаша келісімімен тартуға болады (Кодексте көрсетілген төтенше жағдайлардан басқа). Шегі — күніне 2 сағат, айына 12 сағат. Уақыттық төлемде үстеме жұмыс кемінде бір жарым есе мөлшерде төленеді немесе келісім бойынша демалыс уақытымен өтеледі.','Привлечение к сверхурочной работе допускается только с письменного согласия работника (кроме чрезвычайных случаев, предусмотренных Кодексом). Предел — 2 часа в день и 12 часов в месяц. При повременной оплате сверхурочные оплачиваются не менее чем в полуторном размере или, по соглашению, компенсируются отдыхом.','Overtime requires the employee’s written consent (except emergencies listed in the Code). Limits: 2 hours a day and 12 hours a month. Under time-based pay, overtime is paid at least 1.5 times the rate or, by agreement, compensated with time off.'],
    refs:[['lc',77,1],['lc',78,1],['lc',78,2],['lc',108]], steps:[['Келісім сұралмаса, жазбаша келісім беру не бермеу — сіздің құқығыңыз.','Давать письменное согласие или нет — ваше право.','Giving written consent or not is your right.'],['Үстеме сағаттарды өзіңіз есепке алып жүріңіз.','Ведите собственный учёт сверхурочных часов.','Keep your own record of overtime hours.'],['Төленбесе — келісім комиссиясына жүгініңіз.','Если не оплачено — обратитесь в согласительную комиссию.','If unpaid — apply to the conciliation commission.']], where:['hr','conc'] },
  { id:'a8', sec:'A', q:['Еңбек қауіпсіздігі','Безопасность труда','Workplace safety'],
    a:['Қызметкер өміріне немесе денсаулығына қауіп төндіретін жағдайда жұмысты орындаудан бас тартуға құқылы, бұл туралы басшыға жазбаша хабарлайды. Жұмыс беруші кәсіптік тәуекелдерді бағалап, оларды азайту шараларын қолдануға міндетті. Қызметкер жұмыс орнындағы еңбек жағдайын тексеру үшін аумақтық бөлімшеге жүгіне алады.','Работник вправе отказаться от работы при ситуации, угрожающей жизни или здоровью, письменно уведомив руководителя. Работодатель обязан оценивать профессиональные риски и принимать меры по их снижению. Работник может обратиться в территориальное подразделение за обследованием условий труда.','An employee may refuse work that threatens their life or health, notifying the manager in writing. The employer must assess occupational risks and reduce them. The employee may ask the territorial unit to inspect workplace conditions.'],
    refs:[['lc',181,1,5],['lc',182,2,1],['lc',181,1,3]], steps:[['Қауіпті жағдайды фото және жазбаша сипаттаңыз.','Зафиксируйте опасную ситуацию фото и письменно.','Record the hazard in writing and with photos.'],['Басшыға жазбаша хабарлаңыз.','Письменно уведомите руководителя.','Notify management in writing.'],['Шешілмесе — еңбек инспекциясына.','Если не решено — в инспекцию труда.','If unresolved — the labour inspectorate.']], where:['dep','insp'] },
  { id:'a9', sec:'A', q:['Жұмыстан босату тәртібі','Порядок увольнения','Termination of employment'],
    a:['Өз бастамаңызбен шартты бұзу үшін жұмыс берушіге кемінде бір ай бұрын жазбаша хабарлайсыз; осы мерзімде өтінішті кері қайтарып алуға болады. Жұмыс беруші бастамасымен бұзу тек Кодексте көрсетілген негіздер бойынша мүмкін; ұйым таратылғанда немесе штат қысқарғанда кемінде бір ай бұрын хабарлануы тиіс. Еңбекке уақытша жарамсыздық пен еңбек демалысы кезінде (кейбір жағдайлардан басқа) жұмыс берушінің бастамасымен босатуға шектеу бар.','По своей инициативе вы уведомляете работодателя письменно не менее чем за месяц; в этот период заявление можно отозвать. Расторжение по инициативе работодателя возможно только по основаниям Кодекса; при ликвидации или сокращении штата — уведомление не менее чем за месяц. Увольнение по инициативе работодателя в период нетрудоспособности и отпуска ограничено (с исключениями).','To resign you notify the employer in writing at least one month ahead and may withdraw the notice during that period. Dismissal by the employer is possible only on grounds in the Code; for liquidation or staff cuts at least one month’s notice is required. Dismissal during sick leave or holiday is restricted (with exceptions).'],
    refs:[['lc',56,1],['lc',56,4],['lc',52,1],['lc',53,1],['lc',54]], steps:[['Өтінішті екі данада жазып, тіркеу нөмірін алыңыз.','Подайте заявление в двух экземплярах и получите регистрационный номер.','Submit your notice in two copies and get it registered.'],['Бұйрықтың көшірмесін сұраңыз.','Запросите копию приказа.','Request a copy of the order.'],['Келіспесеңіз — келісім комиссиясына бір ай ішінде.','Не согласны — в согласительную комиссию в течение месяца.','If you disagree — conciliation commission within one month.']], where:['hr','conc','court'] },
  { id:'a10', sec:'A', q:['Еңбек дауын қалай шешемін?','Как решить трудовой спор?','How do I resolve a labour dispute?'],
    a:['Жеке еңбек даулары алдымен ұйымдағы келісім комиссиясында қаралады, ол өтінішті 15 жұмыс күні ішінде қарайды. Шешілмеген мәселелер немесе комиссия шешімі орындалмаса — сотқа. Жұмысқа қайта алу туралы дауда комиссияға бұйрық көшірмесін алғаннан кейін бір ай ішінде, ал басқа дауларда құқық бұзылғанын білген күннен бастап бір жыл ішінде жүгінуге болады.','Индивидуальные трудовые споры сначала рассматривает согласительная комиссия организации — в течение 15 рабочих дней. Неурегулированные вопросы или неисполнение её решения — в суд. По спорам о восстановлении на работе в комиссию обращаются в течение месяца после получения копии приказа, по остальным — в течение года со дня, когда узнали о нарушении.','Individual labour disputes first go to the organisation’s conciliation commission, which decides within 15 working days. Unresolved issues, or a decision not carried out, go to court. Reinstatement claims must reach the commission within one month of receiving the order; other claims within one year of learning of the breach.'],
    refs:[['lc',159,1],['lc',159,5],['lc',160,1]], steps:[['Өтінішті жазбаша, дәлелдерімен дайындаңыз.','Подготовьте письменное заявление с доказательствами.','Prepare a written application with evidence.'],['Келісім комиссиясына тіркетіңіз.','Зарегистрируйте его в согласительной комиссии.','Register it with the conciliation commission.'],['Шешіммен келіспесеңіз — сотқа.','При несогласии с решением — в суд.','If you disagree with the decision — go to court.']], where:['conc','court'] },
  /* ---------- B. Педагог құқықтары ---------- */
  { id:'b1', sec:'B', q:['Педагогтің кәсіптік құқықтары','Профессиональные права педагога','A teacher’s professional rights'],
    a:['Педагог мемлекеттік стандарт шеңберінде оқыту әдістері мен нысандарын еркін таңдайды, кәсіби қызметіне заңсыз араласудан қорғалады, ұйымдастырушылық және материалдық-техникалық қамтамасыз етілуге, кемінде үш жылда бір рет біліктілігін арттыруға құқылы. Басшының актілері мен шешімдеріне жоғары тұрған лауазымды тұлғаға немесе сотқа шағымдана алады.','Педагог свободно выбирает методы и формы обучения в рамках госстандарта, защищён от незаконного вмешательства, имеет право на организационное и материально-техническое обеспечение, на повышение квалификации не реже одного раза в три года. Он вправе обжаловать акты и решения руководителя вышестоящему должностному лицу или в суд.','Teachers freely choose teaching methods within the state standard, are protected from unlawful interference, are entitled to organisational and material support and to professional training at least once every three years, and may appeal the head’s acts and decisions to a higher official or a court.'],
    refs:[['ps',7,1,1],['ps',7,1,2],['ps',7,1,4],['ps',7,1,12],['ps',7,1,19]], steps:[['Құқығыңыз бұзылса, жағдайды жазбаша сипаттаңыз.','При нарушении права опишите ситуацию письменно.','If a right is breached, describe the situation in writing.'],['Admin Connect арқылы жауапты қызметкерге жіберіңіз.','Направьте через Admin Connect ответственному сотруднику.','Send it via Admin Connect to the responsible officer.']], where:['dep','court'] },
  { id:'b2', sec:'B', q:['Заңсыз жұмысқа тартудан қорғану','Защита от привлечения к посторонним работам','Protection from unrelated assignments'],
    a:['Педагогті кәсіптік міндеттеріне байланысты емес жұмыс түрлеріне тартуға (заңда көзделген жағдайлардан басқа), заңнамада көзделмеген есептілікті талап етуге, құжаттаманы бір мезгілде қағаз және электрондық түрде жүргізуді талап етуге, заңда көзделмеген тексерулерге және тауар мен қызмет сатып алуға мәжбүрлеуге тыйым салынады.','Запрещается привлекать педагога к работам, не связанным с профобязанностями (кроме случаев по закону), требовать не предусмотренную законодательством отчётность, требовать ведения документации одновременно на бумаге и в электронном виде, проводить не предусмотренные законом проверки и обязывать покупать товары и услуги.','It is prohibited to assign teachers work unrelated to their duties (unless a law allows it), to demand reports not provided for by legislation, to require records on paper and electronically at the same time, to run inspections not provided for by law, or to oblige teachers to buy goods or services.'],
    refs:[['ps',6,2,1],['ps',6,2,2],['ps',6,2,3],['ps',6,2,4]], steps:[['Тапсырманың негізін (бұйрық, заң) жазбаша сұраңыз.','Письменно запросите основание поручения (приказ, закон).','Ask in writing for the legal basis of the assignment.'],['Негіз болмаса, 6-бапқа сілтеме жасап, сыпайы бас тартыңыз.','Если основания нет, вежливо откажитесь со ссылкой на ст. 6.','If there is none, politely decline citing Article 6.']], where:['dep','court'] },
  { id:'b3', sec:'B', q:['Кәсіби даму құқығы мен міндеті','Право и обязанность профессионального развития','Right and duty of professional development'],
    a:['Педагог кемінде үш жылда бір рет біліктілігін арттыруға, үздіксіз кәсіби дамуға және оқу нысанын таңдауға құқылы. Сонымен бірге ол кәсіби шеберлігін үнемі жетілдіріп, біліктілік санатын кемінде бес жылда бір рет растауға міндетті.','Педагог имеет право на повышение квалификации не реже раза в три года, непрерывное развитие и выбор формы обучения. При этом он обязан совершенствовать мастерство и подтверждать квалификационную категорию не реже одного раза в пять лет.','Teachers have the right to training at least once every three years, continuous development and a choice of format. They must also keep improving and confirm their qualification category at least once every five years.'],
    refs:[['ps',7,1,12],['ps',7,1,13],['ps',15,1,3]], steps:[['Курстарыңызды «Цифрлық портфолиоға» енгізіп отырыңыз.','Вносите курсы в «Цифровой паспорт».','Log your courses in the Digital Passport.'],['Аттестация мерзімін жоспарлаңыз.','Планируйте сроки аттестации.','Plan your attestation dates.']], where:['dep','hr'] },
  { id:'b4', sec:'B', q:['Педагогтің әлеуметтік кепілдіктері','Социальные гарантии педагога','Teachers’ social guarantees'],
    a:['Заң педагогтерге тұрғын үй (оның ішінде қызметтік) алуға, 56 күнтізбелік күндік еңбек демалысына, жылына бір рет сауықтыру жәрдемақысына, балаларын үйге жақын мектепке дейінгі ұйымға басым тәртіппен орналастыруға кепілдік береді. Ауылдағы педагогтерге қосымша қолдау қарастырылған.','Закон гарантирует педагогам жильё (в т. ч. служебное), отпуск 56 календарных дней, ежегодное пособие на оздоровление, первоочередное устройство детей в дошкольные организации по месту жительства. Для сельских педагогов предусмотрены дополнительные меры.','The law guarantees teachers housing (including service housing), 56 days’ leave, an annual health allowance and priority preschool places for their children near home, with extra support for rural teachers.'],
    refs:[['ps',12,1],['ps',12,3],['ps',12,5]], steps:[['Өз аймағыңыздағы қолдау шараларын әкімдіктен нақтылаңыз.','Уточните региональные меры поддержки в акимате.','Check regional support measures with the local akimat.']], where:['hr'] },
  { id:'b5', sec:'B', q:['Педагогтің міндеттері','Обязанности педагога','A teacher’s duties'],
    a:['Педагог кәсіби құзыреттілігін сақтайды, білім сапасын стандарттан төмен түсірмейді, педагогтік әдепті сақтайды, міндетті медициналық тексеруден өтеді, оқушылар мен ата-аналардың ар-намысын құрметтейді, арнаулы әлеуметтік көмекті қажет ететін балалар туралы басшылыққа, ал кәмелетке толмағандарға қатысты құқық бұзушылық белгілері туралы құқық қорғау органдарына хабарлайды, ата-аналарға кеңес береді. Сабақты саяси үгітке пайдалануға тыйым салынған.','Педагог поддерживает компетентность, обеспечивает качество не ниже стандарта, соблюдает этику, проходит обязательные медосмотры, уважает честь учеников и родителей, сообщает руководству о детях, нуждающихся в спецсоцуслугах, а правоохранительным органам — о признаках правонарушений в отношении несовершеннолетних, консультирует родителей. Использовать уроки для политической агитации запрещено.','Teachers maintain competence, keep quality at or above the standard, follow ethics, undergo mandatory medical checks, respect students’ and parents’ dignity, report children needing special social services to management and signs of offences against minors to law enforcement, and advise parents. Using lessons for political campaigning is prohibited.'],
    refs:[['ps',15,1],['ps',15,2]], steps:[['Міндеттер тізімін лауазымдық нұсқаулықпен салыстырыңыз.','Сверьте перечень с должностной инструкцией.','Compare with your job description.']], where:['dep'] },
  { id:'b6', sec:'B', q:['Педагогикалық әдеп қалай реттеледі?','Как регулируется педагогическая этика?','How is pedagogical ethics regulated?'],
    a:['Педагогтік әдеп заңдылық, адалдық, жауапкершілік және ар-намысты құрметтеу қағидаттарына негізделеді; оны бұзу — тәртіптік теріс қылық. Нормалары уәкілетті орган бекіткен Әдеп қағидаларында. Мәселелерді педагогтік әдеп жөніндегі кеңес қарайды, оның шешімі ұсынымдық сипатта; педагогтің ісі тек оның келісімімен жария етіледі.','Педагогическая этика основана на законности, честности, ответственности и уважении достоинства; её нарушение — дисциплинарный проступок. Нормы закреплены в Правилах педагогической этики. Вопросы рассматривает совет по педагогической этике, его решения носят рекомендательный характер; дело педагога предаётся огласке только с его согласия.','Pedagogical ethics rests on legality, honesty, responsibility and respect for dignity; breaching it is a disciplinary offence. The norms are in the Rules of Pedagogical Ethics. Cases go to the Ethics Council, whose decisions are advisory; a teacher’s case is made public only with their consent.'],
    refs:[['ps',5],['ps',16],['eth']], steps:[['Әдеп қағидаларының толық мәтінімен танысыңыз.','Ознакомьтесь с полным текстом Правил этики.','Read the full Ethics Rules.'],['Кеңесте түсініктеме беру құқығыңызды пайдаланыңыз.','Используйте право дать пояснения на совете.','Use your right to give explanations to the council.']], where:['ethc'] },
  /* ---------- C. Жас маман ---------- */
  { id:'c1', sec:'C', q:['Тәлімгердің міндеттері қандай?','Каковы обязанности наставника?','What are the mentor’s duties?'],
    a:['Тәлімгер 10 күнтізбелік күн ішінде жас маманның дайындық деңгейін анықтайды, Тәлімгерлік жоспарын құрып, жыл бойы жүзеге асырады, сабақтарына айына кемінде 2 рет кері байланыспен қатысады, құжаттамаға көмектеседі, кеңес, кәсіби әңгіме немесе коучинг өткізеді және жыл соңында есеп дайындайды.','Наставник в течение 10 календарных дней определяет уровень подготовки, составляет План наставничества и реализует его в течение года, посещает уроки не реже 2 раз в месяц с обратной связью, помогает с документацией, проводит консультации или коучинг и готовит отчёт в конце года.','Within 10 calendar days the mentor assesses the new teacher’s level, drafts and implements the Mentoring Plan over the year, observes lessons with feedback at least twice a month, helps with paperwork, holds consultations or coaching and writes a year-end report.'],
    refs:[['r160',null,6],['r160',null,8]], steps:[['Платформадағы «Тәлімгерлік» бөлімінде кездесулер санын қадағалаңыз.','Отслеживайте число встреч в разделе «Наставничество».','Track meeting counts in the Mentoring section.']], where:['dep'] },
  { id:'c2', sec:'C', q:['Тәлімгерлік мерзімі және тағайындау','Срок и назначение наставничества','Mentoring term and appointment'],
    a:['Орта білім беру ұйымында алғаш жұмыс бастаған педагогке бір оқу жылына тәлімгер бекітіледі. Кандидатураны педагогикалық кеңес қарайды, басшы жұмысқа қабылданған күннен бастап бес жұмыс күнінен кешіктірмей бұйрықпен бекітеді. Бір педагогке бір тәлімгер бекітіледі.','Педагогу, впервые приступившему к работе в организации среднего образования, закрепляется наставник на один учебный год. Кандидатуру рассматривает педсовет, руководитель утверждает приказом не позднее пяти рабочих дней с даты приёма. За одним педагогом закрепляется один наставник.','A teacher starting work at a secondary school for the first time is assigned a mentor for one academic year. The teachers’ council considers the candidate and the head approves by order within five working days of hiring. One mentor per new teacher.'],
    refs:[['ps',13,1],['r160',null,3],['r160',null,4]], steps:[['Бұйрықтың шыққанын кадр бөлімінен нақтылаңыз.','Уточните в отделе кадров наличие приказа.','Check with HR that the order has been issued.']], where:['hr','ped'] },
  { id:'c3', sec:'C', q:['Тәлімгерге қойылатын талаптар','Требования к наставнику','Requirements for mentors'],
    a:['Тәлімгерде «педагог-зерттеуші» немесе «педагог-шебер» санаты болуы, әдеп нормаларын сақтауы және соңғы үш жылдағы білім сапасы белгіленген деңгейден төмен болмауы тиіс (шағын жинақты мектептерде талап төменірек).','Наставник должен иметь категорию «педагог-исследователь» или «педагог-мастер», соблюдать этику, качество знаний за последние три года — не ниже установленного уровня (для малокомплектных школ требование ниже).','A mentor must hold the “teacher-researcher” or “master teacher” category, observe ethics and show student results over the last three years at or above the set level (lower threshold for small rural schools).'],
    refs:[['r160',null,14],['r160',null,15]], steps:[['Smart Mentor Match ұсынысында санат көрсетіледі.','Категория отображается в рекомендации Smart Mentor Match.','The category appears in Smart Mentor Match results.']], where:['dep'] },
  { id:'c4', sec:'C', q:['Тәлімгерлік үшін қосымша ақы','Доплата за наставничество','Extra pay for mentoring'],
    a:['Тәлімгерлікті жүзеге асыратын педагогке заңнамада белгіленген тәртіппен қосымша ақы төленеді.','Педагогу, осуществляющему наставничество, выплачивается доплата в порядке, установленном законодательством.','A teacher who mentors receives an additional payment as established by legislation.'],
    refs:[['ps',13,1],['r160',null,12]], steps:[['Бұйрықта тәлімгерлік көрсетілгенін тексеріңіз.','Проверьте, что наставничество указано в приказе.','Check the order names you as mentor.'],['Есептеу парағынан қосымша ақыны тексеріңіз.','Проверьте доплату в расчётном листе.','Check the payment on your payslip.']], where:['hr'] },
  { id:'c5', sec:'C', q:['Жас маманның бейімделуге қатысты құқықтары','Права молодого специалиста на адаптацию','A new teacher’s adaptation rights'],
    a:['Жас маманға жалпы педагогтік құқықтар толық қолданылады. Қағидалар бойынша ол тәлімгермен жұмысты жетілдіру жөнінде басшының орынбасарына ұсыныс енгізе алады және өз өтініші бойынша тәлімгерді ауыстыруды сұрай алады; жаңа тәлімгер бес жұмыс күнінен кешіктірілмей тағайындалады.','На молодого специалиста распространяются все права педагога. По Правилам он может вносить заместителю руководителя предложения по работе с наставником и по своему заявлению просить замены наставника; новый наставник назначается не позднее пяти рабочих дней.','New teachers have all teachers’ rights. Under the Rules they may make proposals to the deputy head about the mentoring and request a change of mentor; a new mentor is appointed within five working days.'],
    refs:[['ps',7,1],['r160',null,7],['r160',null,9],['r160',null,10]], steps:[['Ұсынысты Admin Connect арқылы үйлестірушіге жіберіңіз.','Направьте предложение координатору через Admin Connect.','Send your proposal to the coordinator via Admin Connect.']], where:['dep'] },
  { id:'c6', sec:'C', q:['Жұмыс берушінің міндеттері','Обязанности работодателя','Employer’s duties'],
    a:['Жұмыс беруші еңбек шартында көрсетілген жұмысты беруге, жалақыны толық әрі уақтылы төлеуге, заң мен шартқа сай еңбек жағдайын жасауға міндетті. Тәлімгерлікті оқу ісі жөніндегі орынбасар үйлестіреді: жас маманды ұжымға таныстырады, бейімделу жоспарын құруға көмектесіп, орындалуын бақылайды.','Работодатель обязан предоставить работу по договору, полностью и своевременно платить зарплату, обеспечить условия труда по закону и договору. Наставничество координирует заместитель по учебной работе: представляет молодого специалиста коллективу, помогает составить план адаптации и контролирует его выполнение.','The employer must provide the work agreed in the contract, pay wages fully and on time and ensure lawful working conditions. Mentoring is coordinated by the deputy head (academic), who introduces the new teacher, helps draft the adaptation plan and monitors it.'],
    refs:[['lc',23,2,4],['lc',23,2,5],['lc',23,2,9],['r160',null,5]], steps:[['Бейімделу жоспарының көшірмесін сұраңыз.','Запросите копию плана адаптации.','Ask for a copy of your adaptation plan.']], where:['dep','hr'] },
  /* ---------- D. Жағдаяттар ---------- */
  { id:'d1', sec:'D', q:['Маған еңбек шартында көрсетілмеген жұмыс тапсырылды. Не істеуім керек?','Мне поручили работу, не указанную в трудовом договоре. Что делать?','I was given work not in my contract. What should I do?'],
    a:['Жұмыс беруші шартта көрсетілген жұмысты беруге міндетті; басқа жұмысқа ауыстыру тек қызметкердің келісімімен рәсімделеді. Педагогті кәсіптік міндеттеріне байланысты емес жұмысқа тартуға (заңда көзделгеннен басқа) тыйым салынған.','Работодатель обязан предоставлять работу по договору; перевод на другую работу допускается только с согласия работника. Привлекать педагога к работам, не связанным с профобязанностями (кроме предусмотренных законом), запрещено.','The employer must provide the work in your contract; a transfer to other work requires your consent. Assigning teachers work unrelated to their duties (unless a law provides) is prohibited.'],
    refs:[['lc',23,2,4],['lc',38,2],['ps',6,2,1]], steps:[['Тапсырманы жазбаша және негізімен беруді сұраңыз.','Попросите оформить поручение письменно с основанием.','Ask for the assignment in writing with its basis.'],['Шартыңыз бен лауазымдық нұсқаулықты салыстырыңыз.','Сверьте с договором и должностной инструкцией.','Compare it with your contract and job description.'],['Сыпайы жазбаша жауап беріңіз, 6-бапқа сілтеме жасаңыз.','Дайте вежливый письменный ответ со ссылкой на ст. 6.','Reply politely in writing citing Article 6.'],['Шешілмесе — келісім комиссиясына.','Если не решено — в согласительную комиссию.','If unresolved — conciliation commission.']], where:['dep','hr','conc'] },
  { id:'d2', sec:'D', q:['Менен заңнамада көзделмеген есепті талап етті. Қалай әрекет етемін?','От меня требуют отчёт, не предусмотренный законодательством. Как поступить?','I’m asked for a report not required by law. What do I do?'],
    a:['Заңнамада көзделмеген есептілік пен ақпаратты талап етуге, сондай-ақ құжаттаманы қағаз және электрондық түрде қатар жүргізуді талап етуге тыйым салынған.','Запрещено требовать отчётность и информацию, не предусмотренные законодательством, а также ведение документации одновременно на бумаге и в электронном виде.','Demanding reports or information not provided for by legislation, or requiring paper and electronic records at the same time, is prohibited.'],
    refs:[['ps',6,2,2]], steps:[['Есептің қай нормативтік актіге негізделгенін жазбаша сұраңыз.','Письменно запросите, на каком акте основан отчёт.','Ask in writing which legal act requires the report.'],['Негіз болмаса, 6-баптың 2-тармағына сілтеме жасаңыз.','Если основания нет, сошлитесь на п. 2 ст. 6.','If there is none, cite Article 6(2).'],['Admin Connect арқылы әдіскерге немесе орынбасарға жіберіңіз.','Направьте через Admin Connect методисту или заместителю.','Raise it via Admin Connect with the methodologist or deputy.']], where:['dep'] },
  { id:'d3', sec:'D', q:['Тәлімгер маған көмектеспейді. Қайда жүгінуге болады?','Наставник мне не помогает. Куда обратиться?','My mentor isn’t helping. Where can I turn?'],
    a:['Тәлімгер жоспар құруға, айына кемінде 2 рет сабаққа қатысуға және кеңес беруге міндетті. Тәлімгерлікті оқу ісі жөніндегі орынбасар үйлестіреді. Жас маман өз өтініші бойынша тәлімгерді ауыстыруды сұрай алады — жаңа тәлімгер бес жұмыс күнінен кешіктірілмей тағайындалады.','Наставник обязан составить план, посещать уроки не реже 2 раз в месяц и консультировать. Наставничество координирует заместитель по учебной работе. Молодой специалист вправе по заявлению просить замены наставника — новый назначается не позднее пяти рабочих дней.','The mentor must draft a plan, observe lessons at least twice a month and advise. The deputy head (academic) coordinates mentoring. You may apply for a different mentor; a new one is appointed within five working days.'],
    refs:[['r160',null,5],['r160',null,6],['r160',null,8],['r160',null,9],['r160',null,10]], steps:[['Алдымен тәлімгермен ашық сөйлесіп, кездесу кестесін келісіңіз.','Сначала откровенно поговорите с наставником и согласуйте график.','First talk openly with your mentor and agree a schedule.'],['Кездесулер тарихын платформада тіркеңіз.','Фиксируйте историю встреч на платформе.','Log meetings on the platform.'],['Admin Connect арқылы үйлестірушіге жазыңыз.','Напишите координатору через Admin Connect.','Write to the coordinator via Admin Connect.'],['Қажет болса, ауыстыру туралы өтініш беріңіз.','При необходимости подайте заявление о замене.','If needed, apply for a change of mentor.']], where:['dep'] },
  { id:'d4', sec:'D', q:['Мені жұмыс уақытынан тыс жұмысқа шақырды. Қандай құқықтарым бар?','Меня вызывают работать сверх рабочего времени. Какие у меня права?','I’m asked to work beyond my hours. What are my rights?'],
    a:['Үстеме жұмысқа тек жазбаша келісіміңізбен тартуға болады (төтенше жағдайлардан басқа); шегі — күніне 2, айына 12 сағат; кемінде бір жарым есе төленеді немесе келісім бойынша демалыспен өтеледі.','Сверхурочная работа — только с вашего письменного согласия (кроме чрезвычайных случаев); предел — 2 часа в день и 12 в месяц; оплата не менее чем в полуторном размере или компенсация отдыхом по соглашению.','Overtime needs your written consent (except emergencies); limits are 2 hours a day and 12 a month; it is paid at least 1.5 times or compensated with time off by agreement.'],
    refs:[['lc',77,1],['lc',78,1],['lc',78,2],['lc',108]], steps:[['Шақырудың жазбаша негізін сұраңыз.','Попросите письменное основание.','Ask for the request in writing.'],['Келісесіз бе, жоқ па — жазбаша шешіңіз.','Решите письменно — соглашаетесь или нет.','Decide in writing whether you consent.'],['Сағаттарды есепке алыңыз, төленбесе — келісім комиссиясына.','Учитывайте часы; если не оплачено — в согласительную комиссию.','Track the hours; if unpaid — conciliation commission.']], where:['hr','conc'] },
  { id:'d5', sec:'D', q:['Маған еңбек демалысы берілмей жатыр. Не істеуім керек?','Мне не дают трудовой отпуск. Что делать?','I’m not being given my annual leave. What should I do?'],
    a:['Педагогтің 56 күнтізбелік күндік жыл сайынғы ақылы демалысқа құқығы заңмен кепілдендірілген. Демалысты үзу тек жазбаша келісіммен мүмкін. Дау ұйымдағы келісім комиссиясында, кейін сотта шешіледі; құқық бұзылғанын білген күннен бастап бір жыл ішінде жүгінуге болады.','Право педагога на ежегодный оплачиваемый отпуск 56 календарных дней гарантировано законом. Отзыв из отпуска возможен только с письменного согласия. Спор решается в согласительной комиссии, затем в суде; срок обращения — год со дня, когда вы узнали о нарушении.','Teachers’ right to 56 days’ paid annual leave is guaranteed by law. Recall is possible only with written consent. Disputes go to the conciliation commission, then court, within one year of learning of the breach.'],
    refs:[['ps',12,1,3],['lc',95,1],['lc',159,1],['lc',160,1,2]], steps:[['Демалыс туралы өтінішті жазбаша тіркетіңіз.','Зарегистрируйте письменное заявление на отпуск.','Register a written leave request.'],['Бас тартылса, себебін жазбаша сұраңыз.','При отказе запросите письменное обоснование.','If refused, ask for the reason in writing.'],['Келісім комиссиясына жүгініңіз.','Обратитесь в согласительную комиссию.','Apply to the conciliation commission.']], where:['hr','conc','court'] },
  { id:'d6', sec:'D', q:['Менің және оқушылардың дербес деректері қалай қорғалады?','Как защищаются мои персональные данные и данные учеников?','How are my and students’ personal data protected?'],
    a:['Дербес деректерді жинау мен өңдеу заңда белгіленген шарттармен, негізінен субъектінің келісімімен жүзеге асырылады. Субъект өзі туралы қандай деректер сақталатынын, оларды өңдеу мақсаты мен көзін білуге құқылы. Сондықтан оқушылардың аты-жөні, бағалары сияқты деректерді сыртқы ЖИ сервистеріне енгізбеңіз.','Сбор и обработка персональных данных осуществляются на условиях закона, как правило, с согласия субъекта. Субъект вправе знать, какие данные о нём хранятся, цели и источники обработки. Поэтому не вводите ФИО и оценки учеников во внешние ИИ-сервисы.','Personal data may be collected and processed only on the conditions set by law, generally with the subject’s consent. Data subjects may know what data is held about them and its purpose and source. So never enter students’ names or grades into external AI services.'],
    refs:[['pd',7],['pd',24,1]], steps:[['Платформада оқушылардың жеке деректерін енгізбеңіз.','Не вводите персональные данные учеников на платформе.','Don’t enter student personal data on the platform.'],['Өз деректеріңізді «Деректер» бөлімінде экспорттап немесе жоя аласыз.','Свои данные можно экспортировать или удалить в разделе «Данные».','You can export or delete your data in the Data section.']], where:['digital'] }

  'privacy.title':['Құпиялылық және деректер','Конфиденциальность и данные','Privacy and data'], 'privacy.text':['Бұл нұсқада деректер тек осы құрылғының браузерінде сақталады және ешқайда жіберілмейді. Оқушылардың аты-жөнін, бағаларын және басқа жеке деректерін енгізбеңіз. Сабақ бейнесі құрылғыдан шықпайды. Деректеріңізді кез келген уақытта экспорттап немесе жоя аласыз.','В этой версии данные хранятся только в браузере этого устройства и никуда не передаются. Не вводите ФИО, оценки и иные персональные данные учеников. Видео урока не покидает устройство. Свои данные можно в любой момент экспортировать или удалить.','In this version data stays in this device’s browser and is never sent anywhere. Do not enter students’ names, grades or other personal data. Lesson videos never leave the device. You can export or delete your data at any time.'], 'privacy.agree':['Шарттармен танысып, келісемін','Ознакомлен(а) и согласен(на)','I have read and agree'],

  'in.desc':['Болашақта қосылатын интеграциялар. Қазір олар жұмыс істемейді және ешқандай деректерге қол жеткізілмейді.','Интеграции, которые будут подключены позже. Сейчас они не работают, доступа к данным нет.','Integrations planned for later. They are not active now and access no data.'], 'in.bilim':['BilimClass','BilimClass','BilimClass'], 'in.bilimD':['Сабақ кестесі мен жүктемені алу — мектептің ресми келісімі мен API рұқсатынан кейін.','Получение расписания и нагрузки — после официального соглашения школы и доступа к API.','Timetable and load import — after an official school agreement and API access.'], 'in.nobd':['HR-NOBD (НОБД)','HR-NOBD (НОБД)','HR-NOBD (NOBD)'], 'in.nobdD':['Кадр деректерін синхрондау — тек уәкілетті органның рұқсатымен, логин мен құпиясөз жинамай.','Синхронизация кадровых данных — только с разрешения уполномоченного органа, без сбора логинов и паролей.','Staff-data sync — only with the authority’s permission and without collecting logins or passwords.'], 'in.eds':['ЭЦҚ (NCALayer)','ЭЦП (NCALayer)','Digital signature (NCALayer)'], 'in.edsD':['Құжаттарға заңды күші бар қол қою — ЭЦҚ интеграциясы талаптары орындалғанда ғана.','Юридически значимая подпись документов — только после выполнения требований интеграции ЭЦП.','Legally binding signatures — only once digital-signature integration requirements are met.'], 'in.sync':['Серверлік синхрондау','Серверная синхронизация','Server sync'], 'in.syncD':['Құрылғылар арасында қауіпсіз синхрондау, нақты логин және рөлдік қолжетімділік (Node.js + PostgreSQL).','Безопасная синхронизация между устройствами, вход и роли на сервере (Node.js + PostgreSQL).','Secure cross-device sync, real sign-in and server-side roles (Node.js + PostgreSQL).'], 'in.ai':['Серверлік ЖИ көмекшісі','Серверный ИИ-ассистент','Server-side AI assistant'], 'in.aiD':['Кілттері серверде қорғалған, дереккөзге негізделген ЖИ; пайдалану лимиттерімен. Оқушы деректері жіберілмейді.','ИИ с ключами на сервере и опорой на источники, с лимитами; данные учеников не передаются.','Source-grounded AI with server-protected keys and usage limits; no student data is sent.'], 'in.archTitle':['Архитектура интеграцияға дайын','Архитектура готова к интеграциям','Integration-ready architecture'], 'in.a1':['Деректер моделі модульдерге бөлінген (users, pairs, tasks, meetings, requests, audit).','Модель данных разделена по модулям (users, pairs, tasks, meetings, requests, audit).','Data model split by module (users, pairs, tasks, meetings, requests, audit).'], 'in.a2':['Рөлдер мен рұқсаттар бір жерде анықталған (PERMS).','Роли и права определены в одном месте (PERMS).','Roles and permissions defined in one place (PERMS).'], 'in.a3':['Әрекеттер журналы (audit log) әр өзгерісті тіркейді.','Журнал действий фиксирует каждое изменение.','The audit log records every change.'], 'in.a4':['Тілдер бір орталықтан басқарылады (i18n).','Языки управляются централизованно (i18n).','Languages are managed centrally (i18n).'], 'in.a5':['Экспорт: JSON, PDF, DOCX, XLSX — деректерді сыртқы жүйеге беруге дайын.','Экспорт: JSON, PDF, DOCX, XLSX — готово к передаче во внешние системы.','Export: JSON, PDF, DOCX, XLSX — ready to hand data to other systems.'], 'in.a6':['Заңнама модулі юрисдикция бойынша бөлінген.','Правовой модуль разделён по юрисдикциям.','The legal module is split by jurisdiction.'], 'in.a7':['Сервер нұсқасы үшін API, адаптерлер және деректер картасы бөлек дайындалады.','Для серверной версии отдельно готовятся API, адаптеры и маппинг данных.','API, adapters and data mapping are being prepared for the server version.'], 'in.noFake':['Бұл бөлімдегі ешбір интеграция қазір жұмыс істемейді. Платформа сыртқы жүйелердің логині мен құпиясөзін сұрамайды.','Ни одна интеграция в этом разделе сейчас не работает. Платформа не запрашивает логины и пароли внешних систем.','None of these integrations work yet. The platform never asks for logins or passwords to external systems.'],

  'mt.desc':['Жұп, жеке даму жоспары, кездесулер мен тапсырмалар — бір жерде. Барлық есептер осы деректерден автоматты құралады.','Пара, ИПР, встречи и задания — в одном месте. Все отчёты собираются из этих данных автоматически.','Pair, development plan, meetings and tasks in one place. Every report is built from this data automatically.'], 'mt.mentee':['Жас маман','Молодой специалист','New teacher'], 'mt.mentor':['Тәлімгер','Наставник','Mentor'], 'mt.visitsRule':['айына ≥2 (Қағидалар, 6-т.)','≥2 в месяц (Правила, п. 6)','≥2 a month (Rules, para. 6)'], 'mt.flow':['Тізбек: тәлімгер бекітілді → даму жоспары → кездесу жоспарланды → өткізілді → хаттама → тапсырма → орындалды → прогресс → есеп (Paperless School).','Цепочка: наставник утверждён → ИПР → встреча запланирована → проведена → протокол → задание → выполнено → прогресс → отчёт (Paperless School).','Flow: mentor approved → development plan → meeting planned → held → minutes → task → done → progress → report (Paperless School).'], 'mt.idp':['Жеке даму жоспары','Индивидуальный план развития','Individual development plan'], 'mt.idpEmpty':['Мақсаттар әлі қосылмаған','Цели пока не добавлены','No goals yet'], 'mt.idpGoal':['Мақсат','Цель','Goal'], 'mt.idpPh':['Мысалы: критериалды бағалауды меңгеру','Например: освоить критериальное оценивание','e.g. Master criteria-based assessment'], 'mt.tasks':['Тапсырмалар','Задания','Tasks'], 'mt.taskTitle':['Тапсырма атауы','Название задания','Task title'], 'mt.taskDesc':['Сипаттама','Описание','Description'], 'mt.assign':['Тапсырма беру','Выдать задание','Assign task'], 'mt.assigned':['Тапсырма берілді','Задание выдано','Task assigned'], 'mt.feedback':['Кері байланыс','Обратная связь','Feedback'], 'mt.meetings':['Кездесулер','Встречи','Meetings'], 'mt.held':['өткізілді','проведено','held'], 'mt.planned':['жоспарда','запланировано','planned'], 'mt.planned1':['Кездесу жоспарланды','Встреча запланирована','Meeting planned'], 'mt.type':['Түрі','Тип','Type'], 'mt.topic':['Тақырып','Тем   'mm.desc':['Жас маманның қажеттілігі, пәні, кестесі және цифрлық дағдылары бойынша тәлімгерді ұсынады.','Подбирает наставника по потребностям, предмету, графику и цифровым навыкам молодого специалиста.','Recommends a mentor by the new teacher’s needs, subject, schedule and digital skills.'], 'mm.disclaimer':['Бұл тек ұсыныс. Тәлімгерді ресми бекіту құқығы уәкілетті мектеп қызметкерінде (педагогикалық кеңес қарайды, басшы бұйрықпен бекітеді — Тәлімгерлік қағидалары, 4-т.).','Это только рекомендация. Официально утверждает наставника уполномоченный сотрудник школы (рассматривает педсовет, утверждает руководитель приказом — Правила наставничества, п. 4).','This is a recommendation only. The mentor is officially approved by the authorised school officer (considered by the teachers’ council, approved by the head’s order — Mentoring Rules, para. 4).'], 'mm.noMentees':['Тәлімгері жоқ жас маман табылмады','Нет молодых специалистов без наставника','No new teachers without a mentor'], 'mm.forWhom':['Жас маман','Молодой специалист','New teacher'], 'mm.needs':['Маған қандай көмек қажет?','Какая помощь мне нужна?','What support do I need?'], 'mm.needsHint':['Басқан сайын: ☆ → ★ маңызды → ★★ өте маңызды','По нажатию: ☆ → ★ важно → ★★ очень важно','Click to cycle: ☆ → ★ important → ★★ very important'], 'mm.profileUse':['Профильден: пән — {s}; күндер — {d}; цифрлық дағды — {g}/5.','Из профиля: предмет — {s}; дни — {d}; цифровые навыки — {g}/5.','From profile: subject — {s}; days — {d}; digital skills — {g}/5.'], 'mm.editProfile':['Өзгерту','Изменить','Edit'], 'mm.method':['Есептеу әдісі','Методика расчёта','How it’s calculated'], 'mm.c.needs':['Даму қажеттілігі мен тәлімгердің күшті жақтары','Потребности и сильные стороны наставника','Needs vs mentor strengths'], 'mm.c.subject':['Пәндік сәйкестік','Предметное соответствие','Subject match'], 'mm.c.sched':['Жұмыс кестесінің сәйкестігі','Совпадение графика','Schedule overlap'], 'mm.c.exp':['Жұмыс тәжірибесі','Опыт работы','Experience   'wb.desc':['Апта сайынғы 30 секундтық өзіндік тексеру. Бұл медициналық диагноз емес — жеке рефлексия құралы.','Еженедельная 30-секундная самопроверка. Это не медицинский диагноз — инструмент личной рефлексии.','A weekly 30-second check-in. Not a medical diagnosis — a personal reflection tool.'], 'wb.private':['Бұл деректерді тек сіз көресіз — тәлімгер де, әкімшілік те көрмейді. Олар экспорт пен есептерге қосылмайды.','Эти данные видите только вы — ни наставник, ни администрация. Они не попадают в отчёты.','Only you can see this — not your mentor, not management. It is never included in reports.'], 'wb.thisWeek':['Осы аптаның тексеруі','Проверка этой недели','This week’s check-in'], 'wb.done':['Өтілді','Пройдено','Done'], 'wb.needSupport':['Маған қолдау қажет','Мне нужна поддержка','I would like support'], 'wb.note':['Қысқа жазба (міндетті емес)','Короткая заметка (необязательно)','Short note (optional)'], 'wb.index':['Әл-ауқат индексі','Индекс благополучия','Wellbeing index'], 'wb.dynHint':['Динамика 2-аптадан бастап көрінеді','Динамика появится со 2-й недели','Trends appear from week 2'], 'wb.higherBetter':['Барлық көрсеткіш «жоғары — жақсы» түрінде.','Все показатели приведены к виду «выше — лучше».','All scores are shown as “higher is better”.'], 'wb.tips':['Демалыс пен қолдау','Отдых и поддержка','Rest and support'], 'wb.lowNote':['Соңғы кезде көрсеткіш төмен немесе қолдау сұрадыңыз. Тәлімгермен, мектеп психологымен немесе сенімді адаммен сөйлесу көмектесуі мүмкін. Сұраныс жіберу — тек сіздің шешіміңіз.','Показатель снижен или вы отметили потребность в поддержке. Может помочь разговор с наставником, психологом или близким человеком. Отправлять ли обращение — решаете только вы.','Your scores are low or you asked for support. Talking to your mentor, the school psychologist or someone you trust may help. Whether to send a request is entirely your choice.'], 'wb.askSupport':['Әдіскерге сұраныс дайындау','Подготовить обращение методисту','Draft a request to the methodologist'], 'wb.reqSubject':['Бейімделу бойынша қолдау','Поддержка в адаптации','Support with adaptation'], 'wb.first':['Алғашқы тексеруден кейін динамикаңыз осында шығады','После первой проверки здесь появится динамика','Your trend appears here after the first check-in'], 'wb.wipe':['Wellbeing деректерін өшіру','Удалить данные Wellbeing','Delete wellbeing data'], 'wb.wipeAsk':['Барлық өзіндік тексеру деректері өшеді. Жалғастырасыз ба?','Все данные самопроверок будут удалены. Продолжить?','All check-in data will be deleted. Continue?'], 'wb.saved':['Рахмет! Тексеру сақталды','Спасибо! Проверка сохранена','Thank you! Check-in saved'],
  'mr.desc':['Сабақты бейне немесе тікелей бақылау арқылы 8 критерий бойынша талдаңыз.','Анализ урока по 8 критериям — по видео или при прямом наблюдении.','Analyse a lesson against 8 criteria, from video or live observation.'], 'mr.privacy':['Бейне интернетке жүктелмейді — тек құрылғыңызда ашылады.','Видео не загружается в интернет — открывается только на устройстве.','The video is never uploaded — it opens only on your device.'], 'mr.video':['Бейне','Видео','Video'], 'mr.live':['Тікелей бақылау','Прямое наблюдение','Live observation'], 'mr.pick':['Бейнефайлды таңдаңыз','Выберите видеофайл','Choose a video file'], 'mr.pickHint':['MP4, WebM, MOV — файл ешқайда жіберілмейді','MP4, WebM, MOV — файл никуда не передаётся','MP4, WebM, MOV — the file is never sent anywhere'], 'mr.other':['Басқа бейне','Другое видео','Another video'], 'mr.start':['▶ Бастау','▶ Старт','▶ Start'], 'mr.pause':['⏸ Тоқтату','⏸ Пауза','⏸ Pause'], 'mr.reset':['↺ Нөлдеу','↺ Сброс','↺ Reset'], 'mr.mark':['Белгі қою','Отметки','Mark a moment'], 'mr.strength':['Күшті жақ','Сильная сторона','Strength'], 'mr.growth':['Даму аймағы','Зона роста','Growth area'], 'mr.notePh':['Қысқа пікір, содан кейін критерийді басыңыз','Короткий комментарий, затем нажмите критерий','Short comment, then click a criterion'], 'mr.keys':['⌨️ 1–8 пернелері критерийді белгілейді. Уақыт белгісін басу бейнені сол сәтке қайтарады.','⌨️ Клавиши 1–8 ставят отметку. Нажатие на время перематывает видео.','⌨️ Keys 1–8 add a mark. Clicking a timestamp jumps the video there.'], 'mr.marks':['Белгілер','Отметки','Marks'], 'mr.noMarks':['Белгі әлі қойылмаған','Отметок пока нет','No marks yet'], 'mr.seek':['Бейнені осы сәтке ауыстыру','Перемотать видео','Jump video to'], 'mr.summary':['Қорытынды','Итог','Summary'], 'mr.topic':['Сабақ тақырыбы','Тема урока','Lesson topic'], 'mr.class':['Сынып','Класс','Class'], 'mr.star1':['Бірінші жұлдыз','Первая звезда','First star'], 'mr.star2':['Екінші жұлдыз','Вторая звезда','Second star'], 'mr.wish':['
