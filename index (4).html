  'co2.desc':['Бақылау жазбаларынан күшті жақтарды, даму аймақтарын, ұсыныстарды, келесі сабақ мақсатын және «Екі жұлдыз, бір тілек» есебін құрастырады.','По записям наблюдения определяет сильные стороны, зоны роста, рекомендации, цель следующего урока и отчёт «Две звезды и одно пожелание».','Turns observation notes into strengths, growth areas, recommendations, a next-lesson goal and a “Two stars and a wish” report.'], 'co2.privacy':['Талдау құрылғыда, интернетсіз, кілт сөздер мен педагогикалық ережелер бойынша жүреді: бейне де, мәтін де сыртқа жіберілмейді. Генеративті ЖИ сервер нұсқасында қосылады.','Анализ выполняется на устройстве, без интернета, по ключевым словам и педагогическим правилам: ни видео, ни текст не передаются. Генеративный ИИ появится в серверной версии.','Analysis runs on the device, offline, using keywords and teaching rules: neither video nor text leaves it. Generative AI arrives with the server version.'], 'co2.notes':['Бақылау жазбалары (әр пікір жаңа жолдан)','Записи наблюдения (каждая с новой строки)','Observation notes (one per line)'], 'co2.ph':['05:20 Оқу мақсаты нақты қойылды\n12:40 - Топтық жұмыста екі оқушы енжар болды\n+ Кері байланыс нақты','05:20 Цель урока поставлена чётко\n12:40 - В групповой работе двое пассивны\n+ Обратная связь конкретная','05:20 Clear learning objective\n12:40 - Two students passive in group work\n+ Specific feedback'], 'co2.hint':['«+» — күшті жақ, «-» — даму аймағы. Белгісіз болса, коуч мағынасынан анықтайды.','«+» — сильная сторона, «-» — зона роста. Без знака коуч определит по смыслу.','“+” = strength, “-” = growth area. Without a sign the coach infers it.'], 'co2.fromMirror':['Сабақ айнасынан','Из Зеркала урока','From Lesson Mirror'], 'co2.import':['Алу','Загрузить','Load'], 'co2.run':['Талдау','Анализировать','Analyse'], 'co2.prompt':['ЖИ-ге дайын сұраныс','Готовый запрос для ИИ','Copy AI prompt'], 'co2.result':['Нәтиже','Результат','Result'], 'co2.lines':['{n} жазба','{n} записей','{n} notes'], 'co2.strengths':['Күшті жақтар','Сильные стороны','Strengths'], 'co2.growth':['Даму аймақтары','Зоны роста','Growth areas'], 'co2.noStrengths':['Күшті жақтар анықталмады','Сильные стороны не найдены','No strengths detected'], 'co2.noGrowth':['Айқын даму аймағы жоқ','Явных зон роста нет','No clear growth areas'], 'co2.missing':['Жазбаларда көрінбеген критерийлер','Критерии, не отражённые в записях','Criteria not covered by the notes'], 'co2.recs':['Нақты ұсыныстар','Конкретные рекомендации','Recommendations'], 'co2.goal':['Келесі сабаққа даму мақсаты','Цель развития на следующий урок','Next-lesson development goal'], 'co2.tsw':['Екі жұлдыз және бір тілек','Две звезды и одно пожелание','Two stars and a wish'], 'co2.empty':['Жазбаларды енгізіп, «Талдау» батырмасын басыңыз','Введите записи и нажмите «Анализировать»','Enter notes and click Analyse'], 'co2.history':['Талдаулар тарихы','История анализов','Analysis history'], 'co2.docTitle':['Сабақ бойынша кері байланыс: Екі жұлдыз және бір тілек','Обратная связь по уроку: две звезды и одно пожелание','Lesson feedback: two stars and a wish'], 'co2.needNotes':['Жазбаларды енгізіңіз','Введите записи','Enter notes'], 'co2.defaultGoal':['Келесі сабақта бір жаңа әдісті сынап, нәтижесін тәлімгермен талдаймын.','На следующем уроке опробую новый приём и разберу результат с наставником.','Next lesson I will try one new technique and review it with my mentor.'], 'co2.demoTopic':['Бөлшектерді салыстыру','Сравнение дробей','Comparing fractions'],
  'co2.demoNotes':['02:10 Оқу мақсаты тақтаға жазылып, нақты түсіндірілді\n07:30 Ашық сұрақтар қойылды, оқушылар белсенді жауап берді\n14:00 - Топтық жұмыста екі оқушы енжар болды\n21:15 Кері байланыс нақты, мадақтау орынды\n28:40 - Әлсіз оқушыларға қолдау болмады\n38:00 - Рефлексияға уақыт жетпеді, сабақ созылды\n+ Сынып климаты жайлы, оқушылар бір-бірін құрметтеді','02:10 Цель урока записана на доске и чётко объяснена\n07:30 Заданы открытые вопросы, ученики активно отвечали\n14:00 - В групповой работе двое учеников были пассивны\n21:15 Обратная связь чёткая, похвала уместная\n28:40 - Слабым ученикам не хватило поддержки\n38:00 - На рефлексию не хватило времени, урок затянулся\n+ Климат в классе доброжелательный, ученики уважали друг друга','02:10 Objective written on the board and clearly explained\n07:30 Open questions asked, students answered actively\n14:00 - Two students were passive in group work\n21:15 Feedback was clear and praise well placed\n28:40 - Weaker students lacked support\n38:00 - No time left for reflection, the lesson overran\n+ Classroom climate was warm and students respected each other'],
  'co2.promptText':['Сен тәжірибелі педагог-коучсың. {c}-сыныптағы «{t}» сабағының бақылау жазбалары төменде. Критерийлер: {k}. 1) 3 күшті жақ, 2) 2 даму аймағы, 3) нақты ұсыныстар, 4) келесі сабаққа SMART мақсат. Оқушылардың аты-жөні алынып тасталды.\nЖазбалар:\n{n}','Ты опытный педагог-коуч. Ниже записи наблюдения урока «{t}» в {c} классе. Критерии: {k}. 1) 3 сильные стороны, 2) 2 зоны роста, 3) конкретные рекомендации, 4) SMART-цель на следующий урок. ФИО учеников удалены.\nЗаписи:\n{n}','You are an experienced instructional coach. Below are observation notes from the “{t}” lesson, class {c}. Criteria: {k}. Give 1) 3 strengths, 2) 2 growth areas, 3) concrete recommendations, 4) a SMART goal for the next lesson. Student names have been removed.\nNotes:\n{n}'],
  'sm.desc':['Нақты педагогикалық жағдаяттар: шешім қабылдап, оның ықтимал салдарын көріңіз.','Реальные педагогические ситуации: примите решение и увидьте его возможные последствия.','Real teaching situations: make a decision and see its likely consequences.'], 'sm.cases':['Жағдаяттар (таңдау)','Ситуации (выбор)','Cases (choices)'], 'sm.dialog':['Виртуалды мектеп (еркін жауап)','Виртуальная школа (свободный ответ)','Virtual school (free reply)'], 'sm.done':['Өтілді','Пройдено','Done'], 'sm.again':['Қайта өту','Пройти снова','Try again'], 'sm.start':['Бастау','Начать','Start'], 'sm.total':['Шешімдердің құндылықтарға жиынтық әсері','Суммарное влияние решений на ценности','Overall impact of decisions on values'], 'sm.totalHint':['Жағдаяттарды өткен соң нәтиже шығады','Результат появится после прохождения ситуаций','Results appear after you complete cases'], 'sm.finished':['аяқталды','завершено','complete'], 'sm.discuss':['Тәлімгермен талқылау сұрақтары','Вопросы для обсуждения с наставником','Questions to discuss with your mentor'], 'sm.back':['Тізімге','К списку','Back to list'], 'sm.step':['{a}-қадам / {b}','Шаг {a} из {b}','Step {a} of {b}'], 'sm.what':['Сіз не істейсіз?','Что вы сделаете?','What do you do?'], 'sm.consequence':['Ықтимал салдары','Возможные последствия','Likely consequences'], 'sm.next':['Келесі →','Далее →','Next →'], 'sm.results':['Нәтижелер тарихы','История результатов','Results history'], 'sm.case':['Жағдай','Ситуация','Case'], 'sm.comm':['Қарым-қатынас','Коммуникация','Communication'], 'sm.act':['Шешім','Решение','Decision'], 'sm.eth':['Кәсіби этика','Профессиональная этика','Professional ethics'], 'sm.listen':['Тыңдау','Прослушать','Listen'], 'sm.yourReply':['Сіздің жауабыңыз','Ваш ответ','Your reply'], 'sm.replyPh':['Кейіпкерге өз сөзіңізбен жауап беріңіз…','Ответьте персонажу своими словами…','Reply to the character in your own words…'], 'sm.voice':['Дауыспен','Голосом','Voice'], 'sm.listening':['Тыңдап тұр…','Слушаю…','Listening…'], 'sm.send':['Жауап беру →','Ответить →','Reply →'], 'sm.voiceNote':['Дауыспен енгізу браузердің сөйлеуді тану мүмкіндігін пайдаланады (Chrome ұсынылады). Бағалау құрылғыда жүреді.','Голосовой ввод использует распознавание речи браузера (рекомендуется Chrome). Оценка выполняется на устройстве.','Voice input uses the browser’s speech recognition (Chrome recommended). Scoring runs on the device.'], 'sm.evaluation':['Бағалау','Оценка','Evaluation'], 'sm.model':['Үлгі жауап','Образец ответа','Model reply'], 'sm.dialogLog':['Диалог','Диалог','Dialogue'], 'sm.you':['Сіз','Вы','You'], 'sm.fbComm':['Эмпатиядан бастаңыз: «түсінемін», «айтқаныңызға рахмет» сияқты сөздер қарсы тараптың ашуын басады.','Начните с эмпатии: «понимаю», «спасибо, что сказали» снижают напряжение.','Start with empathy: “I understand”, “thank you for telling me” lower tension.'], 'sm.fbAct':['Нақты шешім ұсыныңыз: не істейсіз, қашан, кіммен бірге.','Предложите конкретное решение: что, когда и с кем.','Offer a concrete plan: what, when and with whom.'], 'sm.fbEth':['Кәсіби этиканы сақтаңыз: айыптау, қорқыту және ережеден тыс келісімдерден аулақ болыңыз.','Соблюдайте этику: избегайте обвинений, угроз и договорённостей вне правил.','Keep to professional ethics: avoid blame, threats and off-the-rules deals.'], 'sm.fbGood':['Тамаша: эмпатия, нақты шешім және этика үйлесім тапты.','Отлично: эмпатия, конкретное решение и этика в балансе.','Excellent: empathy, a concrete plan and ethics in balance.'], 'sm.mood.wait':['😐 Күтуде','😐 Ждёт','😐 Waiting'], 'sm.mood.calm':['🙂 Сабасына түсті','🙂 Успокоился','🙂 Calmer'], 'sm.mood.angry':['😤 Наразы','😤 Недоволен','😤 Upset'], 'sm.noTts':['Браузер дауыстап оқуды қолдамайды','Браузер не поддерживает озвучивание','This browser doesn’t support text-to-speech'], 'sm.noVoice':['Бұл браузер дауыспен енгізуді қолдамайды — мәтінмен жазыңыз','Браузер не поддерживает голосовой ввод — напишите текстом','This browser doesn’t support voice input — please type'], 'sm.micDenied':['Микрофонға рұқсат берілмеді','Нет доступа к микрофону','Microphone access denied'], 'sm.voiceErr':['Дауысты тану қатесі','Ошибка распознавания речи','Speech recognition error'], 'sm.needReply':['Жауабыңызды жазыңыз','Напишите ответ','Write your reply'],
  'pr2.desc':['{n} дайын сұраныс. Кез келген ЖИ құралына көшіріп қолданыңыз.','{n} готовых запросов. Скопируйте в любой ИИ-инструмент.','{n} ready-made prompts. Copy into any AI tool.'], 'pr2.ethics':['Оқушылардың аты-жөнін, бағаларын, денсаулығы туралы мәліметтерді сыртқы ЖИ сервистеріне енгізбеңіз. ЖИ жауабын әрдайым тексеріңіз.','Не вводите ФИО, оценки и сведения о здоровье учеников во внешние ИИ-сервисы. Всегда проверяйте ответ ИИ.','Never enter students’ names, grades or health details into external AI services. Always check AI output.'], 'pr2.copy':['Көшіру','Копировать','Copy'], 'pr2.none':['Сұраныс табылмады','Запросы не найдены','No prompts found'],
  'ic.desc':['Тақырып пен тапсырманы енгізіңіз — жүйе оны үш деңгейге бейімдеп, әдістемелік қолдау мен оқуға жеңіл форматты дайындайды.','Введите тему и задание — система адаптирует его на три уровня, подготовит методическую поддержку и упрощённый формат.','Enter a topic and task — the tool adapts it to three levels and prepares support tips and an easy-read version.'], 'ic.grade':['Сынып','Класс','Grade'], 'ic.topic':['Тақырып','Тема','Topic'], 'ic.task':['Тапсырма мәтіні','Текст задания','Task text'], 'ic.needs':['Қосымша қолдау түрлері (диагноз емес)','Виды дополнительной поддержки (не диагноз)','Types of extra support (not a diagnosis)'], 'ic.gen':['Бейімдеу','Адаптировать','Adapt'], 'ic.private':['Құрылғыда жұмыс істейді. Оқушының аты-жөнін енгізудің қажеті жоқ.','Работает на устройстве. ФИО учеников вводить не нужно.','Runs on the device. No student names needed.'], 'ic.levels':['Сараланған тапсырмалар','Дифференцированные задания','Differentiated tasks'], 'ic.lvA':['А — базалық','A — базовый','A — foundation'], 'ic.lvB':['В — орта','B — средний','B — core'], 'ic.lvC':['С — жоғары','C — повышенный','C — extension'], 'ic.desc2':['Дескриптор','Дескриптор','Descriptor'], 'ic.dA':['ұғымдарды атайды, үлгі бойынша орындайды','называет понятия, выполняет по образцу','names key ideas and follows a model'], 'ic.dB':['өз сөзімен түсіндіреді, салыстырады, мысал келтіреді','объясняет своими словами, сравнивает, приводит пример','explains in own words, compares, gives an example'], 'ic.dC':['талдайды, дәлелдейді, жаңа шешім ұсынады','анализирует, аргументирует, предлагает решение','analyses, justifies and proposes a solution'], 'ic.support':['Әдістемелік қолдау','Методическая поддержка','Teaching support'], 'ic.access':['Оқуға жеңіл формат','Упрощённый формат','Easy-read version'], 'ic.noTask':['Тапсырма мәтінін енгізсеңіз, ол қысқа қадамдарға бөлінеді.','Введите текст задания — он будет разбит на короткие шаги.','Enter task text to split it into short steps.'], 'ic.check':['Әр қадамнан кейін белгі қой.','Отмечай каждый выполненный шаг.','Tick each step when done.'], 'ic.empty':['Нәтиже осында шығады','Результат появится здесь','Results appear here'], 'ic.docTitle':['Сараланған тапсырма','Дифференцированное задание','Differentiated task'],
  'ic.a1':['«{t}» тақырыбының негізгі 3–5 ұғымын тірек сөздер арқылы атап шық.','Назови 3–5 ключевых понятий темы «{t}» с опорой на слова-подсказки.','Name 3–5 key ideas in “{t}” using the word bank.'], 'ic.a2':['Ұғымдарды анықтамаларымен сәйкестендір.','Соотнеси понятия с определениями.','Match each term to its definition.'], 'ic.a3':['Үлгі бойынша орында: {s}','Выполни по образцу: {s}','Follow the model: {s}'], 'ic.a3n':['Мұғалім берген үлгіні қайталап орында.','Выполни задание по образцу учителя.','Repeat the teacher’s worked example.'], 'ic.b1':['«{t}» тақырыбын өз сөзіңмен 3–4 сөйлеммен түсіндір.','Объясни тему «{t}» своими словами в 3–4 предложениях.','Explain “{t}” in your own words in 3–4 sentences.'], 'ic.b2':['Екі ұғымды салыстырып, кестеге түсір.','Сравни два понятия и занеси в таблицу.','Compare two ideas in a table.'], 'ic.b3':['Негізгі тапсырма: {s}','Основное задание: {s}','Core task: {s}'], 'ic.b3n':['Өмірден мысал келтіріп, тақырыппен байланыстыр.','Приведи пример из жизни и свяжи его с темой.','Give a real-life example linked to the topic.'], 'ic.c1':['«{t}» бойынша өмірлік мәселені талдап, шешіміңді дәлелде.','Проанализируй жизненную проблему по теме «{t}» и обоснуй решение.','Analyse a real problem linked to “{t}” and justify your solution.'], 'ic.c2':['«{s}» тапсырмасын басқа тәсілмен шешу жолын ұсын.','Предложи другой способ выполнить задание «{s}».','Suggest another way to solve “{s}”.'], 'ic.c2n':['Тапсырманы шешудің екі тәсілін салыстыр.','Сравни два способа решения.','Compare two ways of solving it.'], 'ic.c3':['Сыныптастарыңа 2 зерттеу сұрағын құрастыр.','Составь 2 исследовательских вопроса для класса.','Write 2 research questions for classmates.'],
  'ic.promptText':['Сен инклюзивті білім беру маманысың. {g}-сынып, {s}, «{t}» тақырыбы. Тапсырма: {task}. 1) А/В/С деңгейлеріне бейімде, дескриптор жаз. 2) Мына қолдау түрлеріне нұсқаулық бер: {n}. 3) Оқуға жеңіл нұсқасын дайында. Диагноз қойма, оқушының жеке деректерін сұрама.','Ты специалист по инклюзивному образованию. {g} класс, {s}, тема «{t}». Задание: {task}. 1) Адаптируй на уровни A/B/C с дескрипторами. 2) Дай рекомендации для видов поддержки: {n}. 3) Подготовь упрощённую версию. Не ставь диагнозов и не запрашивай персональные данные.','You are an inclusive-education specialist. Grade {g}, {s}, topic “{t}”. Task: {task}. 1) Adapt to A/B/C levels with descriptors. 2) Give guidance for these support types: {n}. 3) Prepare an easy-read version. Do not diagnose or ask for personal data.'],
  'lg.desc':['Еңбек құқықтары, педагог құқықтары мен міндеттері, тәлімгерлік талаптары — нақты бап пен ресми сілтемемен.','Трудовые права, права и обязанности педагога, требования к наставничеству — со статьёй и официальной ссылкой.','Labour rights, teachers’ rights and duties, mentoring requirements — with exact articles and official links.'], 'lg.jurKZ':['Юрисдикция: Қазақстан','Юрисдикция: Казахстан','Jurisdiction: Kazakhstan'], 'lg.noJur':['Таңдалған юрисдикция үшін құқықтық модуль әлі жоқ. Қазақстан заңнамасы басқа елдермен араластырылмайды.','Для выбранной юрисдикции правовой модуль пока недоступен. Законодательство Казахстана не смешивается с другими странами.','No legal module yet for the selected jurisdiction. Kazakh law is never mixed with other countries’.'], 'lg.enNote':['English text is a professional translation for information only — it is not an official legal text. The official texts are in Kazakh and Russian on adilet.zan.kz.','English text is a professional translation for information only — it is not an official legal text. The official texts are in Kazakh and Russian on adilet.zan.kz.','English text is a professional translation for information only — it is not an official legal text. The official texts are in Kazakh and Russian on adilet.zan.kz.'], 'lg.assistant':['AI Legal Assistant','AI Legal Assistant','AI Legal Assistant'], 'lg.assistantDesc':['Сұрағыңызды қазақша, орысша немесе ағылшынша жазыңыз. Көмекші тек расталған дерекқордан жауап іздейді — заң бабын ойдан шығармайды. Сәйкес жауап болмаса, оны ашық айтады.','Задайте вопрос на казахском, русском или английском. Ассистент ищет ответ только в проверенной базе и не придумывает статьи. Если ответа нет — прямо сообщает об этом.','Ask in Kazakh, Russian or English. The assistant searches only the verified database and never invents articles. If there is no match it says so.'], 'lg.askPh':['Мысалы: менен заңда жоқ есеп талап етеді','Например: требуют отчёт, которого нет в законе','e.g. I’m asked for a report not required by law'], 'lg.ask':['Сұрау','Спросить','Ask'], 'lg.found':['Расталған дерекқордан {n} жауап табылды','Найдено ответов в проверенной базе: {n}','{n} answer(s) found in the verified database'], 'lg.unverified':['Бұл сұраққа расталған жауап дерекқорда жоқ. Жауап ойдан құрастырылмайды. Әдіскерге немесе заңгерге Admin Connect арқылы жүгініңіз, ресми мәтінді adilet.zan.kz сайтынан қараңыз.','В проверенной базе нет ответа на этот вопрос. Ответ не будет придуман. Обратитесь к методисту или юристу через Admin Connect и сверьтесь с официальным текстом на adilet.zan.kz.','There is no verified answer for this question. No answer will be invented. Ask the methodologist or a lawyer via Admin Connect and check the official text on adilet.zan.kz.'], 'lg.registry':['Нормативтік актілер тізілімі','Реестр нормативных актов','Register of legal acts'], 'lg.act':['Акт','Акт','Act'], 'lg.links':['Ресми мәтін','Официальный текст','Official text'], 'lg.checked':['Соңғы тексерілген күні','Дата последней проверки','Last checked'], 'lg.status':['Қолданылуы','Использование','Use'], 'lg.used':['Жауаптарда қолданылады','Используется в ответах','Used in answers'], 'lg.notUsed':['Жауаптарда әлі қолданылмайды','Пока не используется в ответах','Not yet used in answers'], 'lg.markChecked':['Тексерілді деп белгілеу','Отметить как проверенный','Mark as checked'], 'lg.checkAsk':['Акттың қолданыстағы редакциясын adilet.zan.kz-те тексердіңіз бе? Өзгеріс болса, жазбаға түсіңіз.','Вы сверили действующую редакцию на adilet.zan.kz? Если есть изменения, отметьте их.','Have you checked the current version on adilet.zan.kz? Note any changes.'], 'lg.note':['Ескертпе (редакция, өзгерістер)','Примечание (редакция, изменения)','Note (version, changes)'], 'lg.registryNote':['Заң өзгерсе, әдіскер немесе жүйе әкімшісі осы жерде тексерілген күнді жаңартады; жауап мәтінін өзгерту кодтағы legal.js файлында жасалады.','При изменении закона методист или администратор обновляет здесь дату проверки; текст ответов меняется в файле legal.js.','When the law changes, the methodologist or administrator updates the check date here; answer texts are edited in legal.js.'], 'lg.norms':['Қолданылатын норма','Применимая норма','Applicable provisions'], 'lg.steps':['Практикалық әрекет алгоритмі','Алгоритм действий','What to do'], 'lg.where':['Қайда жүгіну керек','Куда обратиться','Where to go'], 'lg.disclaimer':['Бұл модуль ақпараттық көмекші, ресми заңгерлік қорытындының орнына жүрмейді. Шешім қабылдамас бұрын актінің қолданыстағы редакциясын adilet.zan.kz сайтынан тексеріңіз.','Модуль носит информационный характер и не заменяет официальное юридическое заключение. Перед решением сверьтесь с действующей редакцией акта на adilet.zan.kz.','This module is informational and does not replace formal legal advice. Check the current version of the act on adilet.zan.kz before acting.'],
  'dc.desc':['Тәлімгерлік құжаттары енгізілген деректерден автоматты құралады — қайта теру қажет емес.','Документы наставничества формируются автоматически из введённых данных — без повторного ввода.','Mentoring documents are generated from data already entered — no retyping.'], 'dc.rule':['Платформа заңнамада көзделмеген есептілікті міндетті етпейді. «Қағидаларда көзделген» белгісі тек Тәлімгерлік қағидаларында аталған құжаттарға қойылған; қалғандары — жұмысқа көмекші, міндетті емес. Құжатты қағаз бен электронды түрде қатар жүргізуді талап етуге болмайды (Педагог мәртебесі туралы заң, 6-бап 2-т.).','Платформа не делает обязательной отчётность, не предусмотренную законодательством. Метка «предусмотрено Правилами» стоит только у документов из Правил наставничества; остальные — вспомогательные, необязательные. Требовать параллельного ведения на бумаге и в электронном виде нельзя (Закон о статусе педагога, ст. 6 п. 2).','The platform never makes non-statutory reporting mandatory. “In the Rules” marks only documents named in the Mentoring Rules; the rest are optional aids. Requiring both paper and electronic copies is prohibited (Law on the Status of Teachers, Art. 6(2)).'], 'dc.types':['Құжат түрлері','Типы документов','Document types'], 'dc.inRules':['Қағидаларда көзделген','Предусмотрено Правилами','In the Rules'], 'dc.optional':['Қосымша, міндетті емес','Вспомогательный, необязательный','Optional aid'], 'dc.context':['Құжат кімге / неге','Для кого / по чему','For whom / what'], 'dc.basis':['Негіз','Основание','Basis'], 'dc.toReview':['Келісуге жіберу','На согласование','Send for review'], 'dc.agree':['Келісу','Согласовать','Agree'], 'dc.approve':['Бекіту','Утвердить','Approve'], 'dc.return':['Қайтару','Вернуть','Return'], 'dc.history':['Мәртебе тарихы','История статусов','Status history'], 'dc.eds':['Мәртебе — платформа ішіндегі жұмыс белгісі. Электрондық қолтаңбаның заңды күші жоқ: заңды күш үшін қағазға қол қойылады немесе болашақта ЭЦҚ интеграциясы қажет.','Статус — рабочая отметка внутри платформы. Юридической силы электронной подписи нет: для неё документ подписывается на бумаге или потребуется интеграция ЭЦП.','Status is an internal workflow marker with no legal signature value: sign on paper, or a future digital-signature integration is required.'], 'dc.pick':['Құжатты таңдаңыз','Выберите документ','Choose a document'], 'dc.noCtx.pair':['Тәлімгерлік жұп жоқ','Нет пары наставничества','No mentoring pair'], 'dc.noCtx.meeting':['Өткізілген кездесу жоқ','Нет проведённых встреч','No meetings held'], 'dc.noCtx.mirror':['Сабақ айнасында сақталған талдау жоқ','Нет сохранённых анализов в Зеркале урока','No saved Lesson Mirror analyses'], 'dc.noCtx.user':['—','—','—'],
  'dt.plan':['Тәлімгерлік жұмыс жоспары','План наставничества','Mentoring plan'], 'dt.idp':['Жеке даму жоспары','Индивидуальный план развития','Individual development plan'], 'dt.protocol':['Тәлімгерлік кездесу хаттамасы','Протокол встречи наставничества','Mentoring meeting minutes'], 'dt.diary':['Кездесулер күнделігі','Дневник встреч','Meeting log'], 'dt.observation':['Сабаққа қатысу және талдау парағы','Лист посещения и анализа урока','Lesson observation sheet'], 'dt.feedback':['Кері байланыс формасы','Форма обратной связи','Feedback form'], 'dt.road100':['Алғашқы 100 күн есебі','Отчёт «Первые 100 дней»','First 100 days report'], 'dt.interim':['Аралық мониторинг (жартыжылдық есеп)','Промежуточный мониторинг (полугодовой отчёт)','Interim monitoring (half-year report)'], 'dt.final':['Тәлімгерлік қорытынды есебі','Итоговый отчёт наставничества','Final mentoring report'], 'dt.portfolio':['Кәсіби даму портфолиосы','Портфолио профразвития','Professional portfolio'],
  'dst.draft':['Жоба','Черновик','Draft'], 'dst.review':['Келісуде','На согласовании','In review'], 'dst.agreed':['Келісілді','Согласовано','Agreed'], 'dst.approved':['Бекітілді','Утверждено','Approved'],
  'doc.signatures':['Жауапты тұлғалар және қолдар','Ответственные лица и подписи','Responsible persons and signatures'], 'doc.date':['Күні','Дата','Date'], 'doc.org':['Ұйым','Организация','Organisation'], 'doc.period':['Мерзімі','Период','Period'], 'doc.created':['Құрастырылған күні','Дата формирования','Generated on'], 'doc.agreed':['Келісілді (әдіскер / үйлестіруші)','Согласовано (методист / координатор)','Agreed (methodologist / coordinator)'], 'doc.approved':['Бекітемін (уәкілетті қызметкер)','Утверждаю (уполномоченный сотрудник)','Approved (authorised officer)'], 'doc.employee':['Қызметкер','Сотрудник','Employee'], 'doc.byCriteria':['Критерийлер бойынша','По критериям','By criterion'], 'doc.criterion':['Критерий','Критерий','Criterion'], 'doc.timeline':['Уақыт белгілері','Временные отметки','Timestamps'], 'doc.time':['Уақыты','Время','Time'], 'doc.mark':['Белгі','Отметка','Mark'], 'doc.comment':['Пікір','Комментарий','Comment'], 'doc.observer':['Бақылаушы','Наблюдатель','Observer'], 'doc.teacher':['Педагог','Педагог','Teacher'], 'doc.indicator':['Көрсеткіш','Показатель','Indicator'], 'doc.value':['Мәні','Значение','Value'], 'doc.goals':['Даму мақсаттары','Цели развития','Development goals'], 'doc.meetPlan':['Кездесулер мен сабаққа қатысу жоспары','План встреч и посещений','Meetings and observations plan'], 'doc.tasks':['Тапсырмалар','Задания','Tasks'], 'doc.planRule':['Жоспар диагностика негізінде құрылады, оқу ісі жөніндегі орынбасармен келісіліп, басшымен бекітіледі (Тәлімгерлік қағидалары, 6-т.).','План составляется по итогам диагностики, согласуется с заместителем по учебной работе и утверждается руководителем (Правила наставничества, п. 6).','The plan is based on diagnostics, agreed with the deputy head (academic) and approved by the head (Mentoring Rules, para. 6).'], 'doc.indicators':['Негізгі көрсеткіштер','Ключевые показатели','Key indicators'], 'doc.compassDyn':['Құндылық компасы динамикасы','Динамика ценностного компаса','Values Compass trend'], 'doc function radar(series, labels, max = 5, size = 380) {

  for (let r = 1; r <= max; r++) g += `<polygon points="${labels.map((_, i) => pt(i, r).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;
  labels.forEach((l, i) => { const [x, y] = pt(i, max), [lx, ly] = pt(i, max + 1.05); g += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly + 4}" font-size="12.5" fill="var(--muted)" text-anchor="${Math.abs(lx - c) < 8 ? 'middle' : lx > c ? 'start' : 'end'}">${esc(l)}</text>`; });
  series.forEach(s => { if (!s.vals) return; g += `<polygon points="${s.vals.map((v, i) => pt(i, v).join(',')).join(' ')}" fill="${s.fill ? s.color : 'none'}" fill-opacity=".14" stroke="${s.color}" stroke-width="2.2" ${s.dash ? 'stroke-dasharray="6 5"' : ''}/>`; s.vals.forEach((v, i) => { const [x, y] = pt(i, v); g += `<circle cx="${x}" cy="${y}" r="3.2" fill="${s.color}"/>`; }); });
  return `<svg viewBox="-60 ${c - R * 1.32 - 6} ${size + 120} ${R * 2.5 + 20}" class="radar" role="img" aria-label="${esc(t('chart.radar'))}">${g}</svg>`;
}

function lineChart(series, labels, min = 0, max = 100, h = 200) {
  const w = 640, pl = 34, pr = 12, pt = 12, pb = 28, iw = w - pl - pr, ih = h - pt - pb, n = labels.length, X = i => pl + (n <= 1 ? iw / 2 : i * iw / (n - 1)), Y = v => pt + ih - (v - min) / (max - min || 1) * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = min + (max - min) * k / 4; g += `<line x1="${pl}" x2="${w - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(v) + 4}" font-size="11" fill="var(--muted)" text-anchor="end">${Math.round(v)}</text>`; }
  labels.forEach((l, i) => { if (n < 9 || i % Math.ceil(n / 8) === 0) g += `<text x="${X(i)}" y="${h - 8}" font-size="11" fill="var(--muted)" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(s => { const d = s.vals.map((v, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(v)).join(' '); g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round"/>`; s.vals.forEach((v, i) => g += `<circle cx="${X(i)}" cy="${Y(v)}" r="3.6" fill="var(--card)" stroke="${s.color}" stroke-width="2"><title>${esc(labels[i])}: ${Math.round(v)}</title></circle>`); });
  return `<svg viewBox="0 0 ${w} ${h}" class="line" role="img">${g}</svg>`;
}

/* ---------- Smart Mentor Match ---------- */
function matchScore(mentee, m, needs) {
  const keys = Object.keys(needs).filter(k => needs[k] > 0).map(Number), wSum = keys.reduce((a, k) => a + needs[k], 0);
  const cov = keys.filter(k => m.skills.includes(k)), wCov = cov.reduce((a, k) => a + needs[k], 0);
  const same = m.subject === mentee.subject, rel = !same && RELATED.some(g => g.includes(m.subject) && g.includes(mentee.subject));
  const days = (mentee.sched || []).filter(d => (m.sched || []).includes(d));
  const digital = needs[NEEDS_IDX_DIGITAL] ? m.digital / 5 : clamp((mentee.digital - m.digital + 2) / 4, 0, 1);
  const parts = { needs: wSum ? wCov / wSum * 40 : 0, subject: same ? 15 : rel ? 9 : mentee.subject === 0 ? 6 : 0, exp: Math.min(m.exp, 20) / 20 * 10, cat: m.cat / 4 * 10, digital: digital * 10, sched: (mentee.sched || []).length ? days.length / mentee.sched.length * 15 : 0 };
  const load = menteesOf(m.id).length;
  return { score: Math.round(Object.values(parts).reduce((a, b) => a + b, 0)), parts, cov, same, rel, days, load };
}
